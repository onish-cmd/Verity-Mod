name: Build Verity Mod

on:
  push:
    branches: ["main", "master"]
  pull_request:
    branches: ["main", "master"]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle Wrapper Executable
        run: chmod +x gradlew

      - name: Setup Loom Workspace Configurations
        run: ./gradlew migrateMappings vscode idea

      - name: Generate Minecraft Sources
        run: ./gradlew genSources

      - name: Upload Compiled Mod Artifact
        uses: actions/upload-artifact@v4
        with:
          name: verity-compiled-jar
          path: build/libs/*.jar
